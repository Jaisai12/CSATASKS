<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    />
  </head>
  <body class="bg-gray-700 min-h-screen">
    <!-- Title Section -->
    <div class="text-center space-y-6 py-8">
      <h2 class="text-4xl font-bold text-indigo-300">TODO APP</h2>
      <!-- Input Section -->
      <div>
        <input
          type="text"
          placeholder="Enter your task"
          id="taskInput"
          class="border rounded-lg p-3 w-96 border-gray-300 focus:ring-2 focus:ring-indigo-400"
        />
      </div>
      <div>
        <button
          class="bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-500 active:bg-indigo-700 font-semibold"
          onclick="Getdetails()"
          id="addto"
        >
          ADD TASK
        </button>
      </div>
      <hr class="border-t-2 border-gray-300 w-4/5 mx-auto" />
    </div>
    <!-- search bar -->
    <div
      class="my-5 w-96 bg-white h-10 rounded-lg mx-auto flex justify-between items-center"
    >
      <input
        type="text"
        id="searchInput"
        onkeydown="searhTask(event)"
        onchange="seachTodobychange(event)"
        class="rounded-lg w-80 h-full border-none focus:ring-white focus:outline-none focus:ring-0 px-2"
      /><button
        onclick="searchTodo()"
        class="items-center bg-green-500 p-1 rounded-l-full w-1/3 rounded-r-lg"
      >
        <i class="fa-solid fa-magnifying-glass text-2xl text-white"></i>
      </button>
    </div>

    <!-- Tasks Container -->
    <div
      id="container"
      class="text-center flex items-center flex-col space-y-4"
    ></div>

    <script src="todo.js"></script>
  </body>
</html>

`;
